# Policy: DNS Operator Health Check (ADR-003)
# Monitors the DNS ClusterOperator to ensure it is not degraded and is available.
# Remediation: inform -- reports non-compliance without auto-remediation.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-dns-operator-health
  namespace: dns-governance-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: dns-operator-not-degraded
        spec:
          remediationAction: inform
          severity: critical
          object-templates:
            # musthave: the ClusterOperator/dns must exist with these status conditions.
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: ClusterOperator
                metadata:
                  name: dns
                status:
                  conditions:
                    # Degraded=False means no error conditions are present.
                    - type: Degraded
                      status: "False"
                    # Available=True means CoreDNS is serving requests.
                    - type: Available
                      status: "True"
