# Policy: Corefile Configuration Integrity (ADR-004)
# Validates that the CoreDNS Corefile (ConfigMap/dns-default in openshift-dns)
# contains all critical plugins: forward, errors, health, and cache.
# Uses object-templates-raw to dynamically inspect ConfigMap string content.
# Remediation: inform -- reports non-compliance without auto-remediation.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-dns-corefile-integrity
  namespace: dns-governance-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: dns-corefile-has-required-plugins
        spec:
          remediationAction: inform
          severity: high
          object-templates-raw: |
            {{- /* Look up the dns-default ConfigMap that holds the Corefile */ -}}
            {{- $cm := (lookup "v1" "ConfigMap" "openshift-dns" "dns-default") }}
            {{- if $cm }}
              {{- $corefile := $cm.data.Corefile }}
              {{- /* Check that all four critical plugins are present in the Corefile */ -}}
              {{- if and (contains "forward" $corefile) (contains "errors" $corefile) (contains "health" $corefile) (contains "cache" $corefile) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: dns-default
                  namespace: openshift-dns
              {{- else }}
            {{- /* Non-compliant: one or more required plugins are missing.
                   Uses a sentinel ConfigMap name that will never exist,
                   so mustnothave always evaluates to compliant=false. */ -}}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: dns-corefile-missing-required-plugins
                  namespace: openshift-dns
              {{- end }}
            {{- end }}
