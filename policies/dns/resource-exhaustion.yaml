# Policy: CoreDNS Resource Exhaustion Detection (ADR-005)
# Detects when CoreDNS pods are missing on nodes by comparing the dns-default
# DaemonSet's desiredNumberScheduled vs numberAvailable.
# If they don't match, some nodes lack a local DNS resolver.
# Remediation: inform -- reports non-compliance without auto-remediation.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: policy-dns-resource-exhaustion
  namespace: dns-governance-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/controls: CM-2 Baseline Configuration
spec:
  remediationAction: inform
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: dns-daemonset-all-replicas-available
        spec:
          remediationAction: inform
          severity: high
          object-templates-raw: |
            {{- /* Look up the dns-default DaemonSet to check pod availability */ -}}
            {{- $ds := (lookup "apps/v1" "DaemonSet" "openshift-dns" "dns-default") }}
            {{- if $ds }}
              {{- /* Compare desired vs available -- they should be equal */ -}}
              {{- if eq ($ds.status.desiredNumberScheduled | toInt) ($ds.status.numberAvailable | toInt) }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: DaemonSet
                metadata:
                  name: dns-default
                  namespace: openshift-dns
              {{- else }}
            {{- /* Non-compliant: some nodes are missing CoreDNS pods.
                   Sentinel ConfigMap pattern -- this CM will never exist,
                   so mustnothave forces a non-compliant result. */ -}}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: dns-daemonset-replicas-mismatch
                  namespace: openshift-dns
              {{- end }}
            {{- end }}
